<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<!-- Tailwind CSS -->

<script>
tailwind.config = {
theme: {
extend: {
colors: {
'brand-bg': '#121212',
'brand-card': '#1E1E1E',
'brand-wine': '#4A1525',
'brand-border': '#6B1D34',
'brand-accent': '#5A5E27',
'brand-text': '#EFEFC9'
}

}
}

<!-- FontAwesome Icons -->

<body class="min-h-screen flex flex-col bg-brand-bg text-[#EFEFC9] custom-scroll">
<!-- PANTALLA DE BLOQUEO POR PIN PRIVADO (ESTILO CHAT NOIR) -->
<div id="pin-screen" class="fixed inset-0 z-50 bg-[#121212] flex flex-col items-center justify-center p-6 text-center">
<div class="bg-brand-card border border-brand-wine/60 p-8 rounded-3xl max-w-sm w-full space-y-6 shadow-2xl">

</div>
<div>
<h2 class="text-xl font-bold text-amber-100">Archivo Privado</h2>
<p class="text-xs text-[#EFEFC9]/60 mt-1">Ingresa el código secreto de Chat Noir 🐾</p>
</div>
<div>
<input type="password" id="pin-input" class="w-full text-center text-xl py-3 bg-black/60 border border-brand-wine rounded-xl text-amber-200 focus:outline-none focus:border-amber-200" placeholder="Escribe tu clave..." onkeyup="if(event.key==='Enter') checkPin()">
<p id="pin-error" class="text-xs text-red-400 mt-2 hidden">¡Código incorrecto! Inténtalo de nuevo 🐾</p>
</div>
<button type="button" id="btn-unlock" onclick="checkPin()" class="w-full bg-[#5A5E27] active:bg-[#5A5E27]/60 hover:bg-[#5A5E27]/80 text-[#EFEFC9] py-3 rounded-xl font-bold text-sm transition cursor-pointer select-none">
    Desbloquear Archivo
</button>
</div>
</div>
<!-- CONTENIDO DE LA APLICACIÓN (OCULTO HASTA INGRESAR EL PIN) -->
<div id="app-wrapper" class="hidden flex-col min-h-screen">
<!-- HEADER / ENCABEZADO -->

<div class="max-w-7xl mx-auto flex items-center justify-between">

<div class="w-10 h-10 rounded-full bg-brand-wine flex items-center justify-center border border-brand-border text-amber-200">

</div>
<div>

<p class="text-xs text-[#EFEFC9]/60">Miraculous & Fan Works Archive</p>

</div>

<button onclick="promptAddArtist()" class="bg-[#5A5E27] hover:bg-[#5A5E27]/80 text-[#EFEFC9] px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow">
<i class="fa-solid fa-user-plus"></i>
<span>+ Nuevo Artista</span>
</button>

<!-- CONTENIDO PRINCIPAL -->

<!-- MODAL DE FORMULARIOS -->

<i class="fa-solid fa-xmark"></i>

<div id="form-modal-body" class="space-y-4 text-xs"></div>
</div>
    </div>
<!-- MODAL DE IMÁGENES (ZOOM) -->
<div id="image-modal" class="fixed inset-0 z-50 bg-black/90 flex flex-col items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300" onclick="if(event.target===this)closeModal()">
<button onclick="closeModal()" class="absolute top-4 right-4 text-white text-2xl z-20 hover:text-amber-200" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
<button id="modal-prev" onclick="changeModalImage(-1)" class="absolute left-2 sm:left-6 top-1/2 -translate-y-1/2 z-20 text-white text-3xl bg-black/50 hover:bg-brand-wine rounded-full w-11 h-11" aria-label="Imagen anterior"><i class="fa-solid fa-chevron-left"></i></button>
<div class="max-w-4xl max-h-[78vh] overflow-hidden flex items-center justify-center"><img id="modal-image" src="" alt="Vista ampliada" class="max-w-full max-h-[78vh] object-contain rounded-lg"></div>
<button id="modal-next" onclick="changeModalImage(1)" class="absolute right-2 sm:right-6 top-1/2 -translate-y-1/2 z-20 text-white text-3xl bg-black/50 hover:bg-brand-wine rounded-full w-11 h-11" aria-label="Imagen siguiente"><i class="fa-solid fa-chevron-right"></i></button>
<p id="modal-title" class="text-center text-sm font-semibold text-amber-200 mt-3"></p>
<p id="modal-description" class="text-center text-xs text-[#EFEFC9]/85 mt-1 max-w-2xl whitespace-pre-wrap"></p>
<a id="modal-download-btn" href="" download target="_blank" class="mt-2 text-xs bg-brand-wine px-3 py-1.5 rounded-lg text-white hover:bg-brand-border transition"><i class="fa-solid fa-download mr-1"></i> Abrir imagen original</a>
</div>
<script>
// CONTRASEÑA Y CONTROL DE ACCESO
const SECRET_PIN = 'Ch4t N01r';
function checkPin() {
  const input = document.getElementById('pin-input');
  const error = document.getElementById('pin-error');
  const screen = document.getElementById('pin-screen');
  const wrapper = document.getElementById('app-wrapper');

  if (!input || !wrapper || input.value.trim() !== SECRET_PIN) {
    error?.classList.remove('hidden');
    if (input) {
      input.value = '';
      input.focus();
    }
    return;
  }

  // Primero se muestra la aplicación. El bloqueo no debe fallar
  // si el navegador impide guardar datos de sesión.
  screen?.classList.add('hidden');
  wrapper.classList.remove('hidden');
  wrapper.classList.add('flex');
  error?.classList.add('hidden');

  try {
    sessionStorage.setItem('archive_unlocked', 'true');
  } catch (error) {
    console.warn('No se pudo guardar el estado de sesión:', error);
  }

  render();
}

function lockApp() {
  try {
    sessionStorage.removeItem('archive_unlocked');
  } catch (error) {
    console.warn('No se pudo limpiar el estado de sesión:', error);
  }
  location.reload();
}

// BASE DE DATOS LOCAL
const defaultArtists = [{
  id:'art-demo-1', name:'Artista Ejemplo', username:'@miraculous_fanart',
  avatar:'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80',
  profileUrl:'https://instagram.com', bio:'Creador de fancomics y AU de Miraculous Ladybug.',
  comics:[{ id:'comic-1', title:'El Secreto de París',
    cover:'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=600&q=80',
    description:'Un fancomic alternativo sobre Ladybug y Chat Noir.', displayMode:'seasons_chapters',
    activeSeason:'Temporada 1', activeChapter:'Capítulo 1',
    seasonsData:[{name:'Temporada 1',chapters:[{name:'Capítulo 1',pages:[{url:'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=800&q=80'}]}]}],
    continuousPages:[], loreNotes:[{title:'Concepción del AU',text:'Esta historia transcurre 3 años después de la temporada 5.',imageUrl:''}],
    fanfics:[{title:'El diario de Marinette',author:'Artista Ejemplo',link:'https://canva.com',description:'Historia completa en Canva.'}], sketches:[], videos:[]
  }], fanarts:[], animations:[]
}];
function loadArtists() {
  try { const saved = JSON.parse(localStorage.getItem('miraculous_artists_db')); return Array.isArray(saved) ? saved : defaultArtists; }
  catch (_) { return defaultArtists; }
}
let artistsData = loadArtists();
let state = {view:'home',selectedArtistId:null,selectedComicId:null,comicTab:'pages',comicViewMode:'gallery',comicCurrentPage:1};
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function saveData(){ localStorage.setItem('miraculous_artists_db',JSON.stringify(artistsData)); }
function getArtist(id){ return artistsData.find(a=>a.id===id); }
function getComic(artistId,comicId){ return getArtist(artistId)?.comics?.find(c=>c.id===comicId); }
function navigateTo(view,artistId=null,comicId=null,comicTab='pages',pageNum=1){
  state={...state,view,selectedArtistId:artistId,selectedComicId:comicId,comicTab,comicCurrentPage:pageNum}; render();
}
function render(){ const c=$('app-content'); if(!c)return; if(state.view==='artist')renderArtist(c); else if(state.view==='comic')renderComic(c); else renderHome(c); }
function renderHome(container){
  container.innerHTML=`<div class="space-y-6"><div class="flex items-center justify-between"><h2 class="text-xl font-bold text-amber-200">Artistas Registrados (${artistsData.length})</h2></div>
  ${artistsData.length===0?`<div class="text-center py-12 bg-brand-card border border-brand-wine/30 rounded-2xl"><p class="text-[#EFEFC9]/60">No hay artistas registrados aún.</p><button onclick="promptAddArtist()" class="mt-4 bg-[#5A5E27] text-white px-4 py-2 rounded-xl text-xs font-bold">+ Crear Primer Artista</button></div>`:
  `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">${artistsData.map(a=>`<div onclick="navigateTo('artist','${esc(a.id)}')" class="bg-brand-card border border-brand-wine/40 hover:border-brand-border p-4 rounded-2xl transition cursor-pointer flex flex-col justify-between group"><div class="flex items-center gap-3"><img src="${esc(a.avatar)}" alt="${esc(a.name)}" class="w-14 h-14 rounded-full object-cover border-2 border-brand-wine group-hover:border-amber-200 transition"><div class="overflow-hidden"><h3 class="font-bold text-base text-amber-100 truncate">${esc(a.name)}</h3><p class="text-xs text-[#5A5E27] font-semibold">${esc(a.username)}</p></div></div><p class="text-xs text-[#EFEFC9]/70 mt-3 line-clamp-2">${esc(a.bio||'Sin biografía.')}</p><div class="mt-4 pt-3 border-t border-brand-wine/30 flex justify-between items-center text-xs text-amber-200/80"><span><i class="fa-solid fa-book-open mr-1"></i> ${(a.comics||[]).length} Cómics</span><span><i class="fa-solid fa-image mr-1"></i> ${(a.fanarts||[]).length} Fanarts</span><button onclick="deleteArtist('${esc(a.id)}',event)" class="text-red-400 hover:text-red-300 p-1"><i class="fa-solid fa-trash"></i></button></div></div>`).join('')}</div>`}</div>`;
}
function renderArtist(container){
 const a=getArtist(state.selectedArtistId); if(!a){navigateTo('home');return;}
 const fanarts=[...(a.fanarts||[])].map((f,i)=>({...f,_i:i})).reverse();
 container.innerHTML=`<div class="space-y-6"><button onclick="navigateTo('home')" class="text-xs font-semibold text-amber-200 hover:underline flex items-center gap-1"><i class="fa-solid fa-arrow-left"></i> Volver a la lista</button>
 <div class="bg-brand-card border border-brand-wine/50 p-6 rounded-2xl flex flex-col sm:flex-row items-center sm:items-start gap-5 relative"><img src="${esc(a.avatar)}" alt="${esc(a.name)}" class="w-24 h-24 rounded-full object-cover border-4 border-brand-wine"><div class="flex-grow text-center sm:text-left"><h2 class="text-2xl font-bold text-amber-100">${esc(a.name)}</h2><p class="text-sm font-semibold text-[#5A5E27]">${esc(a.username)}</p><p class="text-xs text-[#EFEFC9]/80 mt-2 max-w-2xl">${esc(a.bio||'Sin biografía disponible.')}</p>${a.profileUrl?`<a href="${esc(a.profileUrl)}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-xs text-amber-200 underline mt-2"><i class="fa-solid fa-link"></i> Visitar Red Principal</a>`:''}</div><div class="flex flex-col gap-2"><button onclick="promptAddComic('${esc(a.id)}')" class="bg-[#5A5E27] text-[#EFEFC9] px-4 py-2 rounded-xl text-xs font-bold">+ Nuevo Cómic</button><button onclick="promptAddArtistVideo('${esc(a.id)}')" class="bg-black/40 text-amber-100 border border-brand-wine px-4 py-2 rounded-xl text-xs font-bold">+ Agregar Video</button><button onclick="promptAddArtistFanart('${esc(a.id)}')" class="bg-brand-wine text-amber-200 px-4 py-2 rounded-xl text-xs font-bold">+ Agregar Fanart</button></div></div>
 <div class="space-y-3"><h3 class="text-lg font-bold text-amber-200"><i class="fa-solid fa-book-open mr-2"></i>Cómics de ${esc(a.name)}</h3>${(a.comics||[]).length?`<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">${a.comics.map(c=>`<div onclick="navigateTo('comic','${esc(a.id)}','${esc(c.id)}')" class="bg-brand-card border border-brand-wine/40 rounded-xl overflow-hidden hover:border-amber-200/50 transition cursor-pointer flex flex-col"><img src="${esc(c.cover)}" alt="${esc(c.title)}" class="h-44 w-full object-cover"><div class="p-3 flex-grow"><h4 class="font-bold text-sm text-amber-100">${esc(c.title)}</h4><p class="text-xs text-[#EFEFC9]/70 mt-1">${esc(c.description||'')}</p><div class="mt-3 flex justify-between items-center text-[10px] text-amber-200/80 border-t border-brand-wine/30 pt-2">
  <span>Modo: ${esc(c.displayMode||'Por Capítulos')}</span>
  <button type="button" onclick="event.stopPropagation(); deleteComic('${esc(a.id)}','${esc(c.id)}',event)" class="text-red-400 hover:text-red-300 px-2 py-1">
    <i class="fa-solid fa-trash"></i> Eliminar
  </button>
</div></div></div>`).join('')}</div>`:`<p class="text-xs text-[#EFEFC9]/60 bg-brand-card p-6 rounded-xl border border-brand-wine/30 text-center">No ha publicado cómics aún.</p>`}</div>
 <div class="space-y-3 pt-4 border-t border-brand-wine/30"><div class="flex justify-between items-center"><h3 class="text-lg font-bold text-amber-200"><i class="fa-solid fa-video mr-2"></i>Videos y Animatics General</h3><button onclick="promptAddArtistVideo('${esc(a.id)}')" class="text-xs bg-brand-wine text-amber-200 px-3 py-1.5 rounded-lg">+ Añadir Video</button></div>${(a.animations||[]).length?`<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${a.animations.map((v,i)=>`<div class="bg-brand-card border border-brand-wine/40 p-3 rounded-xl space-y-2"><div class="flex justify-between"><h4 class="font-bold text-xs text-amber-100">${esc(v.title)}</h4><button onclick="deleteArtistVideo('${esc(a.id)}',${i})" class="text-red-400"><i class="fa-solid fa-trash"></i></button></div><div class="aspect-video bg-black rounded-lg overflow-hidden">${getEmbedPlayerHtml(v.url)}</div></div>`).join('')}</div>`:`<p class="text-xs text-[#EFEFC9]/60 bg-brand-card p-4 rounded-xl text-center">No hay videos ni animatics agregados a este perfil.</p>`}</div>
 <div class="space-y-3 pt-4 border-t border-brand-wine/30"><div class="flex justify-between items-center"><h3 class="text-lg font-bold text-amber-200"><i class="fa-solid fa-image mr-2"></i>Fanarts y Dibujos Sueltos</h3><button onclick="promptAddArtistFanart('${esc(a.id)}')" class="text-xs bg-brand-wine text-amber-200 px-3 py-1.5 rounded-lg">+ Añadir Fanart</button></div>${fanarts.length?`<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">${fanarts.map(f=>`<div class="group bg-brand-card rounded-xl overflow-hidden border border-brand-wine/40"><div class="aspect-square overflow-hidden"><img src="${esc(f.url)}" alt="${esc(f.title||'Fanart')}" onclick="openFanartModal('${esc(a.id)}',${f._i})" class="w-full h-full object-cover cursor-zoom-in"></div><div class="flex justify-end px-2 py-1.5"><button type="button" onclick="deleteArtistFanart('${esc(a.id)}',${f._i})" class="text-red-400 p-1" aria-label="Eliminar fanart"><i class="fa-solid fa-trash"></i></button></div></div>`).join('')}</div>`:`<p class="text-xs text-[#EFEFC9]/60 bg-brand-card p-4 rounded-xl text-center">No hay fanarts individuales agregados todavía.</p>`}</div></div>`;
}
function renderComic(container){
 const a=getArtist(state.selectedArtistId), c=getComic(state.selectedArtistId,state.selectedComicId); if(!a||!c){navigateTo('home');return;}
 let season=(c.seasonsData||[]).find(s=>s.name===c.activeSeason)||(c.seasonsData||[])[0];
 let chapter=season?.chapters?.find(x=>x.name===c.activeChapter)||season?.chapters?.[0];
 const pages=c.displayMode==='continuous'?(c.continuousPages||[]):(chapter?.pages||[]);
 const tabs=[['pages','Páginas'],['lore','Lore y curiosidades'],['fanfics','Fanfics'],['sketches','Bocetos / Q&A'],['videos','Videos']];
 let body='';
 if(state.comicTab==='pages') body=`<div class="space-y-4"><div class="flex flex-wrap gap-2">${c.displayMode!=='continuous'?`<select onchange="selectSeason('${a.id}','${c.id}',this.value)" class="bg-brand-card border border-brand-wine rounded-lg p-2 text-xs"><option value="">${(c.seasonsData||[]).length?'Elegir temporada':'Sin temporadas'}</option>${(c.seasonsData||[]).map(s=>`<option value="${esc(s.name)}" ${s.name===season?.name?'selected':''}>${esc(s.name)}</option>`).join('')}</select>${season?`<select onchange="selectChapter('${a.id}','${c.id}',this.value)" class="bg-brand-card border border-brand-wine rounded-lg p-2 text-xs"><option value="">${(season.chapters||[]).length?'Elegir capítulo':'Sin capítulos'}</option>${(season.chapters||[]).map(ch=>`<option value="${esc(ch.name)}" ${ch.name===chapter?.name?'selected':''}>${esc(ch.name)}</option>`).join('')}</select>`:''}<button onclick="promptAddSeason('${a.id}','${c.id}')" class="bg-brand-wine px-3 py-2 rounded-lg text-xs">+ Temporada</button><button onclick="promptAddChapter('${a.id}','${c.id}')" class="bg-brand-wine px-3 py-2 rounded-lg text-xs">+ Capítulo</button>`:''}<button onclick="promptAddPage('${a.id}','${c.id}')" class="bg-[#5A5E27] px-3 py-2 rounded-lg text-xs font-bold">+ Añadir Página</button>
${season ? `<button onclick="deleteSeason('${a.id}','${c.id}',${(c.seasonsData||[]).indexOf(season)})" class="bg-red-900/50 text-red-300 px-3 py-2 rounded-lg text-xs">Eliminar temporada</button>` : ''}
${chapter ? `<button onclick="deleteChapter('${a.id}','${c.id}',${(c.seasonsData||[]).indexOf(season)},${(season.chapters||[]).indexOf(chapter)})" class="bg-red-900/50 text-red-300 px-3 py-2 rounded-lg text-xs">Eliminar capítulo</button>` : ''}
</div>${pages.length?`<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">${pages.map((p,i)=>`<div class="relative"><img src="${esc(p.url)}" alt="${esc(p.title||`Página ${i+1}`)}" onclick="openComicPageModal('${a.id}','${c.id}',${i})" class="w-full rounded-xl border border-brand-wine/40 cursor-pointer"><button onclick="deletePage('${a.id}','${c.id}',${i})" class="absolute top-2 right-2 bg-black/80 text-red-400 rounded p-2"><i class="fa-solid fa-trash"></i></button></div>`).join('')}</div>`:`<p class="text-xs text-[#EFEFC9]/60 bg-brand-card p-6 rounded-xl text-center">Todavía no hay páginas en esta sección.</p>`}</div>`;
 if(state.comicTab==='lore') body=`<div class="space-y-3"><button onclick="promptAddLore('${a.id}','${c.id}')" class="bg-[#5A5E27] px-3 py-2 rounded-lg text-xs">+ Agregar Lore o Curiosidad</button>${(c.loreNotes||[]).map((x,i)=>`<article class="bg-brand-card border border-brand-wine/40 rounded-xl p-4"><h4 class="font-bold text-amber-100">${esc(x.title)}</h4><p class="text-xs mt-2">${esc(x.text)}</p>${x.imageUrl?`<img src="${esc(x.imageUrl)}" class="mt-3 max-h-72 rounded-lg">`:''}<button onclick="removeItem('${a.id}','${c.id}','loreNotes',${i})" class="text-red-400 text-xs mt-2">Eliminar</button></article>`).join('')}</div>`;
 if(state.comicTab==='fanfics') body=`<div class="space-y-3"><button onclick="promptAddFanfic('${a.id}','${c.id}')" class="bg-[#5A5E27] px-3 py-2 rounded-lg text-xs">+ Enlazar Fanfic</button>${(c.fanfics||[]).map((x,i)=>`<article class="bg-brand-card border border-brand-wine/40 rounded-xl p-4"><h4 class="font-bold text-amber-100">${esc(x.title)}</h4><p class="text-xs mt-1">${esc(x.author||'Anónimo')}</p><a class="text-xs text-amber-200 underline" href="${esc(x.link)}" target="_blank" rel="noopener">Abrir fanfic</a><button onclick="removeItem('${a.id}','${c.id}','fanfics',${i})" class="text-red-400 text-xs ml-3">Eliminar</button></article>`).join('')}</div>`;
 if(state.comicTab==='sketches') body=`<div class="space-y-3"><button onclick="promptAddSketch('${a.id}','${c.id}')" class="bg-[#5A5E27] px-3 py-2 rounded-lg text-xs">+ Agregar Boceto / Q&A</button><div class="grid grid-cols-2 sm:grid-cols-3 gap-3">${(c.sketches||[]).map((x,i)=>`<div><img src="${esc(x.url)}" onclick="openModal('${esc(x.url)}','${esc(x.caption)}')" class="w-full rounded-xl cursor-pointer"><p class="text-xs mt-1">${esc(x.caption)}</p><button onclick="removeItem('${a.id}','${c.id}','sketches',${i})" class="text-red-400 text-xs">Eliminar</button></div>`).join('')}</div></div>`;
 if(state.comicTab==='videos') body=`<div class="space-y-3"><button onclick="promptAddVideo('${a.id}','${c.id}')" class="bg-[#5A5E27] px-3 py-2 rounded-lg text-xs">+ Agregar Video</button><div class="grid grid-cols-1 md:grid-cols-2 gap-4">${(c.videos||[]).map((v,i)=>`<div class="bg-brand-card border border-brand-wine/40 p-3 rounded-xl"><h4 class="text-xs font-bold mb-2">${esc(v.title)}</h4><div class="aspect-video bg-black rounded-lg overflow-hidden">${getEmbedPlayerHtml(v.url)}</div><button onclick="removeItem('${a.id}','${c.id}','videos',${i})" class="text-red-400 text-xs mt-2">Eliminar</button></div>`).join('')}</div></div>`;
 container.innerHTML=`<div class="space-y-5"><button onclick="navigateTo('artist','${a.id}')" class="text-xs font-semibold text-amber-200 hover:underline"><i class="fa-solid fa-arrow-left"></i> Volver a ${esc(a.name)}</button><div class="bg-brand-card border border-brand-wine/50 p-4 sm:p-5 rounded-2xl flex flex-col gap-3"><div><h2 class="text-xl font-bold text-amber-100">${esc(c.title)}</h2><p class="text-xs text-[#EFEFC9]/70 mt-1">${esc(c.description||'')}</p></div><label class="text-xs text-amber-200">Organización del cómic <select onchange="updateComicDisplayMode('${a.id}','${c.id}',this.value)" class="ml-2 bg-brand-card border border-brand-wine rounded-lg p-2 text-xs"><option value="seasons_chapters" ${c.displayMode==='seasons_chapters'?'selected':''}>Temporadas y Capítulos</option><option value="chapters_only" ${c.displayMode==='chapters_only'?'selected':''}>Solo Capítulos</option><option value="continuous" ${c.displayMode==='continuous'?'selected':''}>Cómic Continuo</option></select></label></div><div class="flex overflow-x-auto gap-2 border-b border-brand-wine/40 pb-2">${tabs.map(([id,label])=>`<button onclick="setComicTab('${id}')" class="whitespace-nowrap px-3 py-2 rounded-lg text-xs ${state.comicTab===id?'bg-brand-wine text-amber-100':'bg-brand-card text-[#EFEFC9]/70'}">${label}</button>`).join('')}</div>${body}</div>`;
}
function getEmbedPlayerHtml(url){ if(!url)return '<p class="text-xs text-red-400">Sin URL</p>'; const u=String(url); if(/youtube\.com|youtu\.be/.test(u)){let id='';try{const x=new URL(u);id=x.hostname.includes('youtu.be')?x.pathname.slice(1):x.pathname.includes('/shorts/')?x.pathname.split('/shorts/')[1]:x.searchParams.get('v')||'';id=id.split('/')[0];}catch(_){}return id?`<iframe src="https://www.youtube.com/embed/${esc(id)}" class="w-full h-full" frameborder="0" allowfullscreen loading="lazy"></iframe>`:'<p class="text-xs">URL de YouTube no válida</p>'; } if(/instagram\.com|tiktok\.com/.test(u))return `<a href="${esc(u)}" target="_blank" rel="noopener" class="text-amber-200 underline text-xs">Ver publicación</a>`; return `<video src="${esc(u)}" controls class="w-full h-full object-contain"></video>`; }
function setComicTab(tab){state.comicTab=tab;render();}
function setComicViewMode(mode){state.comicViewMode=mode;render();}
function changePage(delta){state.comicCurrentPage=Math.max(1,state.comicCurrentPage+delta);render();}
function updateComicDisplayMode(aid,cid,mode){const c=getComic(aid,cid);if(c){c.displayMode=mode;saveData();render();}}
function selectSeason(aid,cid,name){const c=getComic(aid,cid);if(c){c.activeSeason=name;c.activeChapter=c.seasonsData.find(s=>s.name===name)?.chapters?.[0]?.name||'';saveData();render();}}
function selectChapter(aid,cid,name){const c=getComic(aid,cid);if(c){c.activeChapter=name;saveData();render();}}
function openFormModal(title,html){$('form-modal-title').textContent=title;$('form-modal-body').innerHTML=html;$('form-modal').classList.remove('hidden');}
function closeFormModal(){$('form-modal').classList.add('hidden');}
function field(label,id,placeholder='',type='text'){return `<div><label class="block mb-1 text-amber-200" for="${id}">${label}</label><input type="${type}" id="${id}" placeholder="${placeholder}" class="w-full p-2 bg-black/40 border border-brand-wine rounded-lg text-white"></div>`;}
function area(label,id){return `<div><label class="block mb-1 text-amber-200" for="${id}">${label}</label><textarea id="${id}" class="w-full p-2 bg-black/40 border border-brand-wine rounded-lg text-white" rows="2"></textarea></div>`;}
function modalForm(title,fields,button,saveCall){openFormModal(title,`<div class="space-y-3">${fields}<button type="button" onclick="${saveCall}" class="w-full py-2 bg-[#5A5E27] text-white rounded-xl font-bold">${button}</button></div>`);}
function val(id){return $(id)?.value.trim()||'';}
function promptAddArtist(){modalForm('Añadir Nuevo Artista',field('Nombre del Artista','art-name','Ej: MiraculousFan')+field('Usuario / Red','art-user','@usuario')+field('URL de Imagen de Perfil','art-avatar','https://...')+field('URL del perfil principal','art-profile','https://...')+area('Biografía','art-bio'),'Guardar Artista','saveNewArtist()');}
function saveNewArtist(){const name=val('art-name');if(!name)return;artistsData.push({id:'art-'+Date.now(),name,username:val('art-user')||'@artista',avatar:val('art-avatar')||'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80',profileUrl:val('art-profile'),bio:val('art-bio'),comics:[],fanarts:[],animations:[]});saveData();closeFormModal();render();}
function promptAddComic(aid){modalForm('Añadir Nuevo Cómic',field('Título del Cómic','cmc-title','Ej: Cómic Especial')+field('Portada (URL)','cmc-cover','https://...')+area('Descripción','cmc-desc'),'Guardar Cómic',`saveNewComic('${aid}')`);}
function saveNewComic(aid){const title=val('cmc-title'),a=getArtist(aid);if(!title||!a)return;a.comics=a.comics||[];a.comics.push({id:'comic-'+Date.now(),title,cover:val('cmc-cover'),description:val('cmc-desc'),displayMode:'seasons_chapters',activeSeason:'',activeChapter:'',seasonsData:[],continuousPages:[],loreNotes:[],fanfics:[],sketches:[],videos:[]});saveData();closeFormModal();render();}
function deleteComic(aid, cid, event) {
  event?.stopPropagation();

  const a = getArtist(aid);
  if (!a) return;

  if (!confirm('¿Seguro que quieres eliminar este cómic y todo su contenido?')) return;

  a.comics = (a.comics || []).filter(c => c.id !== cid);

  saveData();
  render();
}

function deleteSeason(aid, cid, seasonIndex) {
  const c = getComic(aid, cid);
  if (!c) return;

  const season = c.seasonsData?.[seasonIndex];
  if (!season) return;

  if (!confirm(`¿Eliminar la temporada "${season.name}" y todos sus capítulos y páginas?`)) return;

  c.seasonsData.splice(seasonIndex, 1);

  const nextSeason = c.seasonsData[0];
  c.activeSeason = nextSeason?.name || '';
  c.activeChapter = nextSeason?.chapters?.[0]?.name || '';

  saveData();
  render();
}

function deleteChapter(aid, cid, seasonIndex, chapterIndex) {
  const c = getComic(aid, cid);
  if (!c) return;

  const season = c.seasonsData?.[seasonIndex];
  const chapter = season?.chapters?.[chapterIndex];
  if (!chapter) return;

  if (!confirm(`¿Eliminar el capítulo "${chapter.name}" y todas sus páginas?`)) return;

  season.chapters.splice(chapterIndex, 1);
  c.activeSeason = season.name;
  c.activeChapter = season.chapters[0]?.name || '';

  saveData();
  render();
                                                                                                                                   }function promptAddSeason(aid,cid){modalForm('Nueva Temporada',field('Nombre de la Temporada','season-name-input','Ej: Temporada 2'),'Crear Temporada',`saveNewSeason('${aid}','${cid}')`);}
function saveNewSeason(aid,cid){const n=val('season-name-input'),c=getComic(aid,cid);if(!n||!c)return;c.seasonsData=c.seasonsData||[];c.seasonsData.push({name:n,chapters:[]});c.activeSeason=n;c.activeChapter='';saveData();closeFormModal();render();}
function promptAddChapter(aid,cid){modalForm('Nuevo Capítulo',field('Nombre del Capítulo','chap-name-input','Ej: Capítulo 2'),'Crear Capítulo',`saveNewChapter('${aid}','${cid}')`);}
function saveNewChapter(aid,cid){const n=val('chap-name-input'),c=getComic(aid,cid);if(!n||!c)return;let s=c.seasonsData?.find(x=>x.name===c.activeSeason)||c.seasonsData?.[0];if(!s)return;s.chapters=s.chapters||[];s.chapters.push({name:n,pages:[]});c.activeChapter=n;saveData();closeFormModal();render();}
function promptAddPage(aid,cid){modalForm('Añadir Página al Cómic',field('URL de la Imagen de la Página','page-url-input','https://...')+field('Título (opcional)','page-title-input','Ej: Chat Noir')+area('Descripción (opcional)','page-description-input'),'Guardar Página',`saveNewPage('${aid}','${cid}')`);}
function saveNewPage(aid,cid){const url=val('page-url-input'),c=getComic(aid,cid),page={url,title:val('page-title-input'),description:val('page-description-input')};if(!url||!c)return;if(c.displayMode==='continuous'){c.continuousPages=c.continuousPages||[];c.continuousPages.push(page);}else{let s=c.seasonsData?.find(x=>x.name===c.activeSeason)||c.seasonsData?.[0],ch=s?.chapters?.find(x=>x.name===c.activeChapter)||s?.chapters?.[0];if(!ch){alert('Primero crea una temporada y un capítulo, o elige el modo Cómic Continuo.');return;}ch.pages=ch.pages||[];ch.pages.push(page);}saveData();closeFormModal();render();}
function deletePage(aid,cid,i){const c=getComic(aid,cid);if(!c)return;if(c.displayMode==='continuous')c.continuousPages.splice(i,1);else{let s=c.seasonsData?.find(x=>x.name===c.activeSeason)||c.seasonsData?.[0],ch=s?.chapters?.find(x=>x.name===c.activeChapter)||s?.chapters?.[0];ch?.pages?.splice(i,1);}saveData();render();}
function promptAddLore(aid,cid){modalForm('Agregar Lore o Curiosidad',field('Título / Tema','lore-title','Ej: Ficha de Personaje')+area('Explicación o Detalles','lore-text')+field('URL de Imagen (opcional)','lore-img','https://...'),'Guardar Lore',`saveNewLore('${aid}','${cid}')`);}
function saveNewLore(aid,cid){const title=val('lore-title'),c=getComic(aid,cid);if(!title||!c)return;c.loreNotes=c.loreNotes||[];c.loreNotes.push({title,text:val('lore-text'),imageUrl:val('lore-img')});saveData();closeFormModal();render();}
function promptAddFanfic(aid,cid){modalForm('Enlazar Fanfic',field('Título del Fanfic','fic-title')+field('Enlace','fic-link','https://...','url')+field('Autor/a','fic-author','Anónimo'),'Guardar Enlace',`saveNewFanfic('${aid}','${cid}')`);}
function saveNewFanfic(aid,cid){const title=val('fic-title'),link=val('fic-link'),c=getComic(aid,cid);if(!title||!link||!c)return;c.fanfics=c.fanfics||[];c.fanfics.push({title,link,author:val('fic-author')||'Anónimo'});saveData();closeFormModal();render();}
function promptAddSketch(aid,cid){modalForm('Agregar Boceto / Q&A',field('URL del Boceto','sk-url','https://...')+field('Descripción / Pregunta (opcional)','sk-cap'),'Guardar Boceto',`saveNewSketch('${aid}','${cid}')`);}
function saveNewSketch(aid,cid){const url=val('sk-url'),c=getComic(aid,cid);if(!url||!c)return;c.sketches=c.sketches||[];c.sketches.push({url,caption:val('sk-cap')});saveData();closeFormModal();render();}
function promptAddVideo(aid,cid){modalForm('Agregar Video al Cómic',field('Título del Video / Animatic','vid-title')+field('URL (YouTube, TikTok, Instagram o video)','vid-url','https://...','url'),'Guardar Video',`saveNewVideo('${aid}','${cid}')`);}
function saveNewVideo(aid,cid){const title=val('vid-title'),url=val('vid-url'),c=getComic(aid,cid);if(!title||!url||!c)return;c.videos=c.videos||[];c.videos.push({title,url});saveData();closeFormModal();render();}
function promptAddArtistFanart(aid){modalForm('Añadir Fanart del Artista',field('URL de la Imagen','art-fa-url','https://...')+field('Título / Descripción','art-fa-title','Fanart'),'Guardar Fanart',`saveNewArtistFanart('${aid}')`);}
function saveNewArtistFanart(aid){const url=val('art-fa-url'),a=getArtist(aid);if(!url||!a)return;a.fanarts=a.fanarts||[];a.fanarts.push({url,title:val('art-fa-title')||'Fanart'});saveData();closeFormModal();render();}
function deleteArtistFanart(aid,i){const a=getArtist(aid);a?.fanarts?.splice(i,1);saveData();render();}
function promptAddArtistVideo(aid){modalForm('Añadir Video del Artista',field('Título del Video','art-vid-title')+field('URL','art-vid-url','https://...','url'),'Guardar Video',`saveNewArtistVideo('${aid}')`);}
function saveNewArtistVideo(aid){const title=val('art-vid-title'),url=val('art-vid-url'),a=getArtist(aid);if(!title||!url||!a)return;a.animations=a.animations||[];a.animations.push({title,url});saveData();closeFormModal();render();}
function deleteArtistVideo(aid,i){getArtist(aid)?.animations?.splice(i,1);saveData();render();}
function deleteArtist(aid,e){e?.stopPropagation();if(!confirm('¿Eliminar este artista y todo su contenido?'))return;artistsData=artistsData.filter(a=>a.id!==aid);saveData();render();}
function removeItem(aid,cid,key,i){const c=getComic(aid,cid);c?.[key]?.splice(i,1);saveData();render();}
let modalItems=[];let modalIndex=0;
function showModalItem(){const item=modalItems[modalIndex];if(!item)return;$('modal-image').src=item.url;$('modal-title').textContent=item.title||'';$('modal-description').textContent=item.description||'';$('modal-download-btn').href=item.url;$('modal-prev').classList.toggle('hidden',modalItems.length<2);$('modal-next').classList.toggle('hidden',modalItems.length<2);}
function openModal(url,title,description=''){modalItems=[{url,title,description}];modalIndex=0;showModalItem();const m=$('image-modal');m.classList.remove('hidden');setTimeout(()=>m.classList.remove('opacity-0'),10);}
function openComicPageModal(aid,cid,index){const c=getComic(aid,cid);if(!c)return;let season=c.displayMode==='continuous'?null:(c.seasonsData||[]).find(x=>x.name===c.activeSeason)||(c.seasonsData||[])[0];let chapter=season?.chapters?.find(x=>x.name===c.activeChapter)||season?.chapters?.[0];const pages=c.displayMode==='continuous'?(c.continuousPages||[]):(chapter?.pages||[]);modalItems=pages.map((p,i)=>({url:p.url,title:p.title||`Página ${i+1}`,description:p.description||''}));modalIndex=index;showModalItem();const m=$('image-modal');m.classList.remove('hidden');setTimeout(()=>m.classList.remove('opacity-0'),10);}
function openFanartModal(aid,originalIndex){const a=getArtist(aid);if(!a)return;const ordered=[...(a.fanarts||[])].reverse();modalItems=ordered.map(f=>({url:f.url,title:f.title||'Fanart',description:f.description||''}));modalIndex=ordered.findIndex((f,i)=>(a.fanarts.length-1-i)===originalIndex);if(modalIndex<0)modalIndex=0;showModalItem();const m=$('image-modal');m.classList.remove('hidden');setTimeout(()=>m.classList.remove('opacity-0'),10);}
function changeModalImage(delta){if(modalItems.length<2)return;modalIndex=(modalIndex+delta+modalItems.length)%modalItems.length;showModalItem();}
function closeModal(){const m=$('image-modal');m.classList.add('opacity-0');setTimeout(()=>m.classList.add('hidden'),300);modalItems=[];}
document.addEventListener('keydown',e=>{if($('image-modal')?.classList.contains('hidden'))return;if(e.key==='ArrowLeft')changeModalImage(-1);if(e.key==='ArrowRight')changeModalImage(1);if(e.key==='Escape')closeModal();});
// AUTO-DESBLOQUEO DE LA SESIÓN ACTUAL
try {
  if (sessionStorage.getItem('archive_unlocked') === 'true') {
    $('pin-screen')?.classList.add('hidden');
    $('app-wrapper')?.classList.remove('hidden');
    $('app-wrapper')?.classList.add('flex');
    render();
  }
} catch (error) {
  // Si el navegador bloquea sessionStorage, se mantiene la pantalla del PIN.
  console.warn('No se pudo restaurar la sesión:', error);
}

</script>
