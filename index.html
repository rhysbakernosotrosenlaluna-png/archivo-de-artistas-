```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivo de Artistas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-bg': '#121212',
                        'brand-card': '#1E1E1E',
                        'brand-wine': '#4A1525',
                        'brand-border': '#6B1D34',
                        'brand-accent': '#5A5E27',
                        'brand-text': '#EFEFC9'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #121212; color: #EFEFC9; font-family: system-ui, -apple-system, sans-serif; }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #4A1525; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: #121212; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-brand-bg text-[#EFEFC9] custom-scroll">

    <!-- HEADER / ENCABEZADO -->
    <header class="bg-brand-card border-b border-brand-wine/50 sticky top-0 z-40 px-4 py-3 shadow-md">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div onclick="navigateTo('home')" class="flex items-center gap-3 cursor-pointer">
                <div class="w-10 h-10 rounded-full bg-brand-wine flex items-center justify-center border border-brand-border text-amber-200">
                    <i class="fa-solid fa-[#5A5E27] fa-mask text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-wide text-amber-100">Archivo de Artistas</h1>
                    <p class="text-xs text-[#EFEFC9]/60">Miraculous & Fan Works Archive</p>
                </div>
            </div>
            <button onclick="promptAddArtist()" class="bg-[#5A5E27] hover:bg-[#5A5E27]/80 text-[#EFEFC9] px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow">
                <i class="fa-solid fa-user-plus"></i>
                <span>+ Nuevo Artista</span>
            </button>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main id="app-content" class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6"></main>

    <!-- MODAL DE FORMULARIOS -->
    <div id="form-modal" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 hidden">
        <div class="bg-brand-card border border-brand-wine/60 w-full max-w-lg rounded-2xl p-5 shadow-2xl relative max-h-[90vh] overflow-y-auto custom-scroll">
            <button onclick="closeFormModal()" class="absolute top-4 right-4 text-[#EFEFC9]/60 hover:text-white text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 id="form-modal-title" class="text-lg font-bold text-amber-200 mb-4 pr-6"></h3>
            <div id="form-modal-body" class="space-y-4 text-xs"></div>
        </div>
    </div>

    <!-- MODAL DE IMÁGENES (ZOOM) -->
    <div id="image-modal" class="fixed inset-0 z-50 bg-black/90 flex flex-col items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <button onclick="closeModal()" class="absolute top-4 right-4 text-white text-2xl z-10 hover:text-amber-200">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="max-w-4xl max-h-[85vh] overflow-hidden flex items-center justify-center">
            <img id="modal-image" src="" alt="Vista ampliada" class="max-w-full max-h-[85vh] object-contain rounded-lg">
        </div>
        <p id="modal-title" class="text-center text-sm font-semibold text-amber-200 mt-3"></p>
        <a id="modal-download-btn" href="" download target="_blank" class="mt-2 text-xs bg-brand-wine px-3 py-1.5 rounded-lg text-white hover:bg-brand-border transition">
            <i class="fa-solid fa-download mr-1"></i> Abrir imagen original
        </a>
    </div>

    <script>
        // BASE DE DATOS INICIAL / LOCAL STORAGE
        let artistsData = JSON.parse(localStorage.getItem('miraculous_artists_db')) || [
            {
                id: 'art-demo-1',
                name: 'Artista Ejemplo',
                username: '@miraculous_fanart',
                avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80',
                profileUrl: 'https://instagram.com',
                bio: 'Creador de fancomics y AU de Miraculous Ladybug.',
                comics: [
                    {
                        id: 'comic-1',
                        title: 'El Secreto de París',
                        cover: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=600&q=80',
                        description: 'Un fancomic alternativo sobre Ladybug y Chat Noir.',
                        displayMode: 'seasons_chapters', // 'seasons_chapters', 'chapters_only', 'continuous'
                        activeSeason: 'Temporada 1',
                        activeChapter: 'Capítulo 1',
                        seasonsData: [
                            {
                                name: 'Temporada 1',
                                chapters: [
                                    {
                                        name: 'Capítulo 1',
                                        pages: [
                                            { url: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=800&q=80' }
                                        ]
                                    }
                                ]
                            }
                        ],
                        loreNotes: [
                            { title: 'Concepción del AU', text: 'Esta historia transcurre 3 años después de la temporada 5.', imageUrl: '' }
                        ],
                        fanfics: [
                            { title: 'El diario de Marinette', author: 'Artista Ejemplo', link: 'https://canva.com', description: 'Historia completa en Canva.' }
                        ],
                        sketches: [],
                        videos: []
                    }
                ],
                fanarts: [],
                animations: []
            }
        ];

        let state = {
            view: 'home', // 'home', 'artist', 'comic'
            selectedArtistId: null,
            selectedComicId: null,
            comicTab: 'pages', // 'pages', 'lore', 'fanfics', 'sketches', 'videos'
            comicViewMode: 'gallery', // 'reader', 'gallery'
            comicCurrentPage: 1
        };

        function saveData() {
            localStorage.setItem('miraculous_artists_db', JSON.stringify(artistsData));
        }

        function navigateTo(view, artistId = null, comicId = null, comicTab = 'pages', pageNum = 1) {
            state.view = view;
            state.selectedArtistId = artistId;
            state.selectedComicId = comicId;
            state.comicTab = comicTab;
            state.comicCurrentPage = pageNum;
            render();
        }

        // RENDERIZADO PRINCIPAL
        function render() {
            const container = document.getElementById('app-content');
            if (!container) return;

            if (state.view === 'home') {
                renderHome(container);
            } else if (state.view === 'artist') {
                renderArtist(container);
            } else if (state.view === 'comic') {
                renderComic(container);
            }
        }

        // 1. VISTA PRINCIPAL (LISTA DE ARTISTAS)
        function renderHome(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <h2 class="text-xl font-bold text-amber-200">Artistas Registrados (${artistsData.length})</h2>
                    </div>

                    ${artistsData.length === 0 ? `
                        <div class="text-center py-12 bg-brand-card border border-brand-wine/30 rounded-2xl">
                            <p class="text-[#EFEFC9]/60">No hay artistas registrados aún.</p>
                            <button onclick="promptAddArtist()" class="mt-4 bg-[#5A5E27] text-white px-4 py-2 rounded-xl text-xs font-bold">+ Crear Primer Artista</button>
                        </div>
                    ` : `
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${artistsData.map(artist => `
                                <div onclick="navigateTo('artist', '${artist.id}')" class="bg-brand-card border border-brand-wine/40 hover:border-brand-border p-4 rounded-2xl transition cursor-pointer flex flex-col justify-between group">
                                    <div class="flex items-center gap-3">
                                        <img src="${artist.avatar}" alt="${artist.name}" class="w-14 h-14 rounded-full object-cover border-2 border-brand-wine group-hover:border-amber-200 transition">
                                        <div class="overflow-hidden">
                                            <h3 class="font-bold text-base text-amber-100 truncate">${artist.name}</h3>
                                            <p class="text-xs text-[#5A5E27] font-semibold">${artist.username}</p>
    </div>
                                    </div>
                                    <p class="text-xs text-[#EFEFC9]/70 mt-3 line-clamp-2">${artist.bio || 'Sin biografía.'}</p>
                                    <div class="mt-4 pt-3 border-t border-brand-wine/30 flex justify-between items-center text-xs text-amber-200/80">
                                        <span><i class="fa-solid fa-book-open mr-1"></i> ${artist.comics ? artist.comics.length : 0} Cómics</span>
                                        <span><i class="fa-solid fa-image mr-1"></i> ${(artist.fanarts || []).length} Fanarts</span>
                                        <button onclick="deleteArtist('${artist.id}', event)" class="text-red-400 hover:text-red-300 p-1">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        // 2. VISTA DE PERFIL DE ARTISTA
        function renderArtist(container) {
            const artist = artistsData.find(a => a.id === state.selectedArtistId);
            if (!artist) { navigateTo('home'); return; }

            container.innerHTML = `
                <div class="space-y-6">
                    <button onclick="navigateTo('home')" class="text-xs font-semibold text-amber-200 hover:underline flex items-center gap-1">
                        <i class="fa-solid fa-arrow-left"></i> Volver a la lista
                    </button>

                    <!-- PERFIL DE ARTISTA -->
                    <div class="bg-brand-card border border-brand-wine/50 p-6 rounded-2xl flex flex-col sm:flex-row items-center sm:items-start gap-5 relative">
                        <img src="${artist.avatar}" alt="${artist.name}" class="w-24 h-24 rounded-full object-cover border-4 border-brand-wine">
                        <div class="flex-grow text-center sm:text-left">
                            <h2 class="text-2xl font-bold text-amber-100">${artist.name}</h2>
                            <p class="text-sm font-semibold text-[#5A5E27]">${artist.username}</p>
                            <p class="text-xs text-[#EFEFC9]/80 mt-2 max-w-2xl">${artist.bio || 'Sin biografía disponible.'}</p>
                            ${artist.profileUrl ? `
                                <a href="${artist.profileUrl}" target="_blank" class="inline-flex items-center gap-1 text-xs text-amber-200 underline mt-2">
                                    <i class="fa-solid fa-link"></i> Visitar Red Principal
                                </a>
                            ` : ''}
                        </div>
                        <div class="flex flex-col gap-2">
                            <button onclick="promptAddComic('${artist.id}')" class="bg-[#5A5E27] text-[#EFEFC9] px-4 py-2 rounded-xl text-xs font-bold hover:bg-[#5A5E27]/80 transition">
                                + Nuevo Cómic
                            </button>
                            <button onclick="promptAddArtistFanart('${artist.id}')" class="bg-brand-wine text-amber-200 px-4 py-2 rounded-xl text-xs font-bold hover:bg-brand-border transition">
                                + Agregar Fanart
                            </button>
                            <button onclick="promptAddArtistVideo('${artist.id}')" class="bg-black/40 text-amber-100 border border-brand-wine px-4 py-2 rounded-xl text-xs font-bold hover:bg-black/60 transition">
                                + Agregar Video
                            </button>
                        </div>
                    </div>

                    <!-- LISTA DE CÓMICS -->
                    <div class="space-y-3">
                        <h3 class="text-lg font-bold text-amber-200"><i class="fa-solid fa-book-open mr-2"></i>Cómics de ${artist.name}</h3>
                        ${(!artist.comics || artist.comics.length === 0) ? `
                            <p class="text-xs text-[#EFEFC9]/60 bg-brand-card p-6 rounded-xl border border-brand-wine/30 text-center">No ha publicado cómics aún.</p>
                        ` : `
                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                                ${artist.comics.map(comic => `
                                    <div onclick="navigateTo('comic', '${artist.id}', '${comic.id}')" class="bg-brand-card border border-brand-wine/40 rounded-xl overflow-hidden hover:border-amber-200/50 transition cursor-pointer flex flex-col">
                                        <img src="${comic.cover}" alt="${comic.title}" class="h-44 w-full object-cover">
                                        <div class="p-3 flex-grow flex flex-col justify-between">
                                            <div>
                                                <h4 class="font-bold text-sm text-amber-100">${comic.title}</h4>
                                                <p class="text-xs text-[#EFEFC9]/70 mt-1 line-clamp-2">${comic.description}</p>
                                            </div>
                                            <div class="mt-3 text-[10px] text-amber-200/80 flex justify-between items-center border-t border-brand-wine/30 pt-2">
                                                <span>Modo: ${comic.displayMode || 'Por Capítulos'}</span>
                                                <i class="fa-solid fa-chevron-right"></i>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>

                    <!-- SECCIÓN: FANARTS Y DIBUJOS SUELTOS DEL ARTISTA -->
                    <div class="space-y-3 pt-4 border-t border-brand-wine/30">
                        <div class="flex justify-between items-center">
                            <h3 class="text-lg font-bold text-amber-200"><i class="fa-solid fa-image mr-2"></i>Fanarts y Dibujos Sueltos</h3>
                            <button onclick="promptAddArtistFanart('${artist.id}')" class="text-xs bg-brand-wine text-amber-200 px-3 py-1.5 rounded-lg border border-brand-border">+ Añadir Fanart</button>
                        </div>
                        ${(!artist.fanarts || artist.fanarts.length === 0) ? `
                            <p class="text-xs text-[#EFEFC9]/60 bg-brand-card p-4 rounded-xl border border-brand-wine/30 text-center">No hay fanarts individuales agregados todavía.</p>
                        ` : `
                            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                                ${artist.fanarts.map(fa => `
                                    <div class="relative group aspect-square bg-brand-card rounded-xl overflow-hidden border border-brand-wine/40">
                                        <img src="${fa.url}" onclick="openModal('${fa.url}', '${fa.title || 'Fanart'}')" class="w-full h-full object-cover cursor-pointer">
                                        <div class="absolute bottom-0 inset-x-0 bg-black/70 p-2 text-[10px] text-amber-100 truncate opacity-0 group-hover:opacity-100 transition">
                                            ${fa.title || 'Ver fanart'}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>

                    <!-- SECCIÓN: VIDEOS Y ANIMATICS DEL ARTISTA -->
                    <div class="space-y-3 pt-4 border-t border-brand-wine/30">
                        <div class="flex justify-between items-center">
                            <h3 class="text-lg font-bold text-amber-200"><i class="fa-solid fa-video mr-2"></i>Videos y Animatics General</h3>
                            <button onclick="promptAddArtistVideo('${artist.id}')" class="text-xs bg-brand-wine text-amber-200 px-3 py-1.5 rounded-lg border border-brand-border">+ Añadir Video</button>
                        </div>
                        ${(!artist.animations || artist.animations.length === 0) ? `
                            <p class="text-xs text-[#EFEFC9]/60 bg-brand-card p-4 rounded-xl border border-brand-wine/30 text-center">No hay videos ni animatics agregados a este perfil.</p>
                        ` : `
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                ${artist.animations.map(vid => `
                                    <div class="bg-brand-card border border-brand-wine/40 p-3 rounded-xl space-y-2">
                                        <h4 class="font-bold text-xs text-amber-100">${vid.title}</h4>
                                        <div class="aspect-video bg-black rounded-lg overflow-hidden flex items-center justify-center">
                                            ${getEmbedPlayerHtml(vid.url)}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        // 3. VISTA DETALLADA DEL CÓMIC (FORMATO COMPLETO ORIGINAL REESTABLECIDO)
        function renderComic(container) {
            const artist = artistsData.find(a => a.id === state.selectedArtistId);
            const comic = artist?.comics.find(c => c.id === state.selectedComicId);
            if (!artist || !comic) { navigateTo('home'); return; }

            // Obtener lista de páginas según el modo
            let currentPagesList = [];
            let season = null;
            let chapter = null;

            if (comic.displayMode === 'continuous') {
                currentPagesList = comic.continuousPages || [];
            } else {
                season = (comic.seasonsData || []).find(s => s.name === comic.activeSeason) || (comic.seasonsData || [])[0];
                chapter = season?.chapters.find(ch => ch.name === comic.activeChapter) || season?.chapters[0];
                currentPagesList = chapter ? (chapter.pages || []) : [];
            }

            const totalPages = currentPagesList.length;
            const currentPageObj = currentPagesList[state.comicCurrentPage - 1];

            container.innerHTML = `
                <div class="space-y-5">
                    <button onclick="navigateTo('artist', '${artist.id}')" class="text-xs font-semibold text-amber-200 hover:underline flex items-center gap-1">
                        <i class="fa-solid fa-arrow-left"></i> Volver a ${artist.name}
                    </button>

                    <!-- ENCABEZADO Y SELECTOR DE MODO -->
                    <div class="bg-brand-card border border-brand-wine/50 p-4 sm:p-5 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 class="text-xl font-bold text-amber-100">${comic.title}</h2>
                            <p class="text-xs text-[#EFEFC9]/70 mt-0.5">${comic.description}</p>
                        </div>
                        <div class="flex items-center gap-2 bg-black/40 p-2 rounded-xl border border-brand-wine/40 text-xs">
                            <span class="text-amber-200 font-bold"><i class="fa-solid fa-sliders"></i> ¿Cómo vas a organizar este cómic?:</span>
                            <select onchange="updateComicDisplayMode('${artist.id}', '${comic.id}', this.value)" class="bg-brand-card text-[#EFEFC9] border border-brand-wine rounded-lg p-1 text-xs">
                                <option value="seasons_chapters" ${comic.displayMode === 'seasons_chapters' ? 'selected' : ''}>Temporadas y Capítulos</option>
                                <option value="chapters_only" ${comic.displayMode === 'chapters_only' ? 'selected' : ''}>Solo Capítulos</option>
                                <option value="continuous" ${comic.displayMode === 'continuous' ? 'selected' : ''}>Cómic Continuo (Sin divisiones)</option>
                            </select>
                        </div>
                    </div>

                    <!-- NAVEGACIÓN DE PESTAÑAS ORIGINAL -->
                    <div class="flex overflow-x-auto gap-2 border-b border-brand-wine/40 pb-2 text-xs font-bold custom-scroll">
                        <button onclick="setComicTab('pages')" class="px-4 py-2 rounded-xl transition ${state.comicTab === 'pages' ? 'bg-[#5A5E27] text-white' : 'bg-brand-card text-[#EFEFC9]/70 hover:text-white'}">
                            <i class="fa-solid fa-book-open mr-1"></i> Páginas
                        </button>
                        <button onclick="setComicTab('lore')" class="px-4 py-2 rounded-xl transition ${state.comicTab === 'lore' ? 'bg-[#5A5E27] text-white' : 'bg-brand-card text-[#EFEFC9]/70 hover:text-white'}">
                            <i class="fa-solid fa-lightbulb mr-1"></i> Curiosidades & Lore
                        </button>
                        <button onclick="setComicTab('fanfics')" class="px-4 py-2 rounded-xl transition ${state.comicTab === 'fanfics' ? 'bg-[#5A5E27] text-white' : 'bg-brand-card text-[#EFEFC9]/70 hover:text-white'}">
                            <i class="fa-solid fa-pen-nib mr-1"></i> Fanfics (Links)
                        </button>
                        <button onclick="setComicTab('sketches')" class="px-4 py-2 rounded-xl transition ${state.comicTab === 'sketches' ? 'bg-[#5A5E27] text-white' : 'bg-brand-card text-[#EFEFC9]/70 hover:text-white'}">
                            <i class="fa-solid fa-palette mr-1"></i> Bocetos & Q&A
                        </button>
                        <button onclick="setComicTab('videos')" class="px-4 py-2 rounded-xl transition ${state.comicTab === 'videos' ? 'bg-[#5A5E27] text-white' : 'bg-brand-card text-[#EFEFC9]/70 hover:text-white'}">
                            <i class="fa-solid fa-video mr-1"></i> Videos
                        </button>
                    </div>

                    <!-- PESTAÑA: PÁGINAS -->
                    ${state.comicTab === 'pages' ? `
                        <div class="space-y-4">
                            <!-- BARRAS DE CAPÍTULOS / TEMPORADAS -->
                            <div class="bg-brand-card p-4 rounded-xl border border-brand-wine/40 space-y-3">
                                ${comic.displayMode === 'seasons_chapters' ? `
                                    <div class="flex flex-wrap items-center gap-2">
                                        <span class="text-xs font-bold text-amber-200"><i class="fa-solid fa-folder-open"></i> Temporadas:</span>
                                        ${(comic.seasonsData || []).map(s => `
                                            <button onclick="selectSeason('${artist.id}', '${comic.id}', '${s.name}')" class="px-3 py-1 rounded-lg text-xs font-semibold ${comic.activeSeason === s.name ? 'bg-brand-wine text-white border border-brand-border' : 'bg-black/40 text-[#EFEFC9]/70'}">
                                                ${s.name}
                                            </button>
                                        `).join('')}
                                        <button onclick="promptAddSeason('${artist.id}', '${comic.id}')" class="text-xs bg-[#5A5E27]/40 text-[#EFEFC9] px-2.5 py-1 rounded-lg border border-[#5A5E27]/50">+ Nueva Temporada</button>
                                    </div>
                                ` : ''}

                                ${(comic.displayMode === 'seasons_chapters' || comic.displayMode === 'chapters_only') ? `
                                    <div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-brand-wine/20">
                                        <div class="flex flex-wrap items-center gap-2">
                                            <span class="text-xs font-bold text-amber-200"><i class="fa-solid fa-bookmark"></i> Capítulos:</span>
                                            ${(season?.chapters || []).map(ch => `
                                                <button onclick="selectChapter('${artist.id}', '${comic.id}', '${ch.name}')" class="px-3 py-1 rounded-lg text-xs font-semibold ${comic.activeChapter === ch.name ? 'bg-[#5A5E27] text-white' : 'bg-black/40 text-[#EFEFC9]/70'}">
                                                    ${ch.name}
                                                </button>
                                            `).join('')}
                                            <button onclick="promptAddChapter('${artist.id}', '${comic.id}')" class="text-xs bg-brand-wine/50 text-[#EFEFC9] px-2.5 py-1 rounded-lg border border-brand-border">+ Nuevo Capítulo</button>
                                        </div>
                                        <button onclick="promptAddPage('${artist.id}', '${comic.id}')" class="bg-[#5A5E27] text-[#EFEFC9] px-3.5 py-1.5 rounded-xl text-xs font-bold">+ Añadir Página</button>
                                    </div>
                                ` : `
                                    <div class="flex justify-between items-center">
                                        <span class="text-xs font-bold text-amber-200">Vista de Modo Continuo (Todas las páginas juntas)</span>
                                        <button onclick="promptAddPage('${artist.id}', '${comic.id}')" class="bg-[#5A5E27] text-[#EFEFC9] px-3.5 py-1.5 rounded-xl text-xs font-bold">+ Añadir Página</button>
                                    </div>
                                `}
                            </div>

        // --- SISTEMA DE REPRODUCCIÓN AUTOMÁTICO DE REDES SOCIALES ---
        function getEmbedPlayerHtml(url) {
            if (!url) return '<p class="text-xs text-red-400">Sin URL</p>';
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let id = url.includes('shorts/') ? url.split('shorts/')[1].split('?')[0] : (url.includes('v=') ? url.split('v=')[1].split('&')[0] : url.split('youtu.be/')[1]);
                return `<iframe src="https://www.youtube.com/embed/${id}" class="w-full h-full" frameborder="0" allowfullscreen></iframe>`;
            }
            if (url.includes('instagram.com') || url.includes('tiktok.com')) {
                return `<iframe src="${url.endsWith('/') ? url : url + '/'}embed" class="w-full h-full" frameborder="0" allowfullscreen></iframe>`;
            }
            return `<video src="${url}" controls class="w-full h-full object-contain"></video>`;
        }
