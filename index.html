<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'archivo-artistas-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "demo-key",
                authDomain: "demo.firebaseapp.com",
                projectId: "demo-project",
                storageBucket: "demo.appspot.com",
                messagingSenderId: "123456789",
                appId: "1:123456789:web:123456"
              };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.db = db;
        window.appId = appId;
        window.auth = auth;

        let currentUser = null;
        let isDataLoadedFromCloud = false;

        async function ensureAuth() {
            if (auth.currentUser) return auth.currentUser;
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    const res = await signInWithCustomToken(auth, __initial_auth_token);
                    return res.user;
                } else {
                    const res = await signInAnonymously(auth);
                    return res.user;
                }
            } catch (err) {
                console.warn("Auth error fallback:", err);
                return null;
            }
        }

        window.initFirebaseSync = async function() {
            await ensureAuth();
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'store', 'artists_archive');
            
            try {
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data && Array.isArray(data.artists) && data.artists.length > 0) {
                        window.artistsData = data.artists;
                        isDataLoadedFromCloud = true;
                        if (window.render) window.render();
                    }
                }
            } catch(e) {
                console.warn("Error leyendo Firestore inicial:", e);
            }

            onSnapshot(docRef, (snapshot) => {
                if (snapshot.exists()) {
                    const cloudData = snapshot.data();
                    if (cloudData && Array.isArray(cloudData.artists)) {
                        window.artistsData = cloudData.artists;
                        isDataLoadedFromCloud = true;
                        try {
                            localStorage.setItem('archivo_artistas_data', JSON.stringify(cloudData.artists));
                        } catch(err) {}
                        if (window.render) window.render();
                    }
                }
            }, (error) => {
                console.error("Error al sincronizar con la nube:", error);
            });
        };

        window.saveDataToCloud = async function() {
            try {
                await ensureAuth();
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'store', 'artists_archive');
                await setDoc(docRef, { artists: window.artistsData });
            } catch (err) {
                console.error("Error guardando datos en la nube:", err);
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            window.initFirebaseSync();
        });
    </script>

        /* Reproductor Multi-plataforma (YouTube, TikTok, Instagram, Vimeo, Links directos) */
        function renderVideoEmbed(url) {
            if (!url) return '';
            
            // Detectar YouTube (Videos normales & Shorts)
            let youtubeMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/|watch\?.+&v=))([\w-]{11})/);
            if (youtubeMatch && youtubeMatch[1]) {
                return `<iframe class="w-full h-full rounded-xl" src="https://www.youtube.com/embed/${youtubeMatch[1]}" title="YouTube video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            }

            // Detectar TikTok
            let tiktokMatch = url.match(/tiktok\.com\/.*\/video\/(\d+)/);
            if (tiktokMatch && tiktokMatch[1]) {
                return `<iframe class="w-full h-full rounded-xl" src="https://www.tiktok.com/embed/v2/${tiktokMatch[1]}" frameborder="0" allowfullscreen></iframe>`;
            }

            // Detectar Instagram (Posts & Reels)
            let instaMatch = url.match(/instagram\.com\/(?:p|reel|reels)\/([^/?#&]+)/);
            if (instaMatch && instaMatch[1]) {
                return `<iframe class="w-full h-full rounded-xl bg-white" src="https://www.instagram.com/p/${instaMatch[1]}/embed" frameborder="0" scrolling="no" allowtransparency="true"></iframe>`;
            }

            // Detectar Vimeo
            let vimeoMatch = url.match(/vimeo\.com\/(\d+)/);
            if (vimeoMatch && vimeoMatch[1]) {
                return `<iframe class="w-full h-full rounded-xl" src="https://player.vimeo.com/video/${vimeoMatch[1]}" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
            }

            // Si es un video directo (MP4, WEBM) o cualquier otro enlace
            return `
                <video controls class="w-full h-full object-cover rounded-xl">
                    <source src="${url}">
                    Tu navegador no soporta reproducir este enlace directamente. <a href="${url}" target="_blank" class="text-amber-200 underline">Ver video en enlace externo</a>.
                </video>
            `;
        }
